# The integrator's own API, generated from externalplatform/examples/aws/api/v1alpha1.
# Run 'make externalplatform-example-api' after editing those Go types. Do not edit this file.
#
# Two types, and the relationship between their names is the contract: HyperShift takes the
# template resource a HostedCluster names, strips the "templates" suffix to get the instance
# resource, and instantiates the instance in the control plane namespace. Rename either one
# and HyperShift will not find the other.
#
# Neither type is a Cluster API type. The Cluster API infrastructure object for this
# integration is Cluster API Provider AWS's own AWSCluster, which the provider creates.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  labels:
    hypershift.openshift.io/external-platform-contract: v1alpha1
  name: awshostedclustertemplates.aws.example.hypershift.openshift.io
spec:
  group: aws.example.hypershift.openshift.io
  names:
    kind: AWSHostedClusterTemplate
    listKind: AWSHostedClusterTemplateList
    plural: awshostedclustertemplates
    singular: awshostedclustertemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AWSHostedClusterTemplate is written by the user, in the HostedCluster's namespace, and
          named by that HostedCluster's spec.platform.external.hostedClusterTemplate.

          The label on this type is load-bearing rather than decorative: HyperShift reads it to
          detect version skew between itself and the integrator before the skew turns into silent
          misbehaviour, and rejects a HostedCluster whose template does not carry it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the template HyperShift instantiates.
            properties:
              template:
                description: template is the object to instantiate.
                properties:
                  spec:
                    description: spec is copied verbatim into the instantiated AWSHostedCluster's
                      spec.
                    properties:
                      region:
                        description: region is the AWS region to build the cluster
                          in.
                        maxLength: 63
                        minLength: 1
                        type: string
                      securityGroupID:
                        description: |-
                          securityGroupID is an existing security group to attach to nodes. Cluster API
                          Provider AWS creates one if this is empty.
                        pattern: ^sg-[0-9a-f]{8,17}$
                        type: string
                      subnetIDs:
                        description: |-
                          subnetIDs are the subnets nodes may be placed in. One per availability zone the
                          cluster should span.
                        items:
                          pattern: ^subnet-[0-9a-f]{8,17}$
                          type: string
                        maxItems: 10
                        minItems: 1
                        type: array
                      tags:
                        additionalProperties:
                          type: string
                        description: tags are applied to every AWS resource created
                          for the cluster.
                        maxProperties: 25
                        type: object
                      vpcID:
                        description: vpcID is an existing VPC to place the cluster's
                          nodes in.
                        pattern: ^vpc-[0-9a-f]{8,17}$
                        type: string
                    required:
                    - region
                    - subnetIDs
                    - vpcID
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: awshostedclusters.aws.example.hypershift.openshift.io
spec:
  group: aws.example.hypershift.openshift.io
  names:
    kind: AWSHostedCluster
    listKind: AWSHostedClusterList
    plural: awshostedclusters
    singular: awshostedcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AWSHostedCluster is instantiated by HyperShift into the control plane namespace, with the
          template's spec copied verbatim.

          It is where the two sides meet: HyperShift creates it and watches its status, the provider
          reconciles it and writes that status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is where in AWS to build the cluster.
            properties:
              controlPlaneEndpoint:
                description: |-
                  controlPlaneEndpoint is where the guest Kubernetes API server is published.

                  Written by HyperShift rather than copied from the template, and the one part of the
                  spec it keeps reconciling. A structural schema prunes fields it does not declare, so
                  dropping this field silently discards the endpoint and the provider has nowhere to
                  point the cluster's nodes.
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 255
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    type: integer
                required:
                - host
                - port
                type: object
              region:
                description: region is the AWS region to build the cluster in.
                maxLength: 63
                minLength: 1
                type: string
              securityGroupID:
                description: |-
                  securityGroupID is an existing security group to attach to nodes. Cluster API
                  Provider AWS creates one if this is empty.
                pattern: ^sg-[0-9a-f]{8,17}$
                type: string
              subnetIDs:
                description: |-
                  subnetIDs are the subnets nodes may be placed in. One per availability zone the
                  cluster should span.
                items:
                  pattern: ^subnet-[0-9a-f]{8,17}$
                  type: string
                maxItems: 10
                minItems: 1
                type: array
              tags:
                additionalProperties:
                  type: string
                description: tags are applied to every AWS resource created for the
                  cluster.
                maxProperties: 25
                type: object
              vpcID:
                description: vpcID is an existing VPC to place the cluster's nodes
                  in.
                pattern: ^vpc-[0-9a-f]{8,17}$
                type: string
            required:
            - region
            - subnetIDs
            - vpcID
            type: object
          status:
            description: status is the provider's report, and the contract's half
              of this object.
            properties:
              conditions:
                description: |-
                  conditions is the provider's report on this object. Ready is the only condition the
                  contract asks for, and its message is mirrored verbatim onto the HostedCluster, where
                  it is the only provider-specific detail a cluster's owner ever sees.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              infrastructure:
                description: |-
                  infrastructure is the Cluster API infrastructure object the provider stood up.
                  HyperShift points the Cluster API Cluster's spec.infrastructureRef at it, and that
                  field is immutable, so this one is in practice immutable too.
                properties:
                  apiGroup:
                    description: |-
                      apiGroup is the API group of the infrastructure object, for example
                      infrastructure.cluster.x-k8s.io.
                    maxLength: 253
                    minLength: 1
                    type: string
                  kind:
                    description: kind is the kind of the infrastructure object, for
                      example AWSCluster.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: |-
                      name is the name of the infrastructure object, which is always in the control plane
                      namespace alongside this object.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              platform:
                description: |-
                  platform is the integration's one-time declaration of what platform this is and
                  whether it runs a cloud controller manager. HyperShift blocks node bootstrap until it
                  is present, and ignores changes once it has observed it.

                  The type is HyperShift's own, so this block cannot drift from what HyperShift reads.
                properties:
                  cloudControllerManager:
                    description: |-
                      cloudControllerManager declares whether the integrator runs a cloud controller
                      manager for this platform.
                    properties:
                      state:
                        description: |-
                          state is either External or None.

                          External means the integrator runs a cloud controller manager. Kubelets are started
                          with --cloud-provider=external, so nodes join tainted with
                          node.cloudprovider.kubernetes.io/uninitialized and the integrator's cloud controller
                          manager must remove that taint. A cluster whose cloud controller manager never
                          arrives has a healthy control plane and no schedulable nodes.

                          None means no cloud controller manager runs. Nodes join untainted, and the
                          integrator's machine controller is responsible for node addresses and provider IDs.
                        enum:
                        - External
                        - None
                        type: string
                    required:
                    - state
                    type: object
                  name:
                    description: |-
                      name is the platform's name as declared by the integrator, for example ExampleCloud.
                      It is propagated verbatim to the guest cluster's Infrastructure at
                      status.platformStatus.external.platformName, which is where everything running in
                      the cluster looks to identify the platform it is running on.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - cloudControllerManager
                - name
                type: object
            type: object
        required:
        - spec
        type: object
