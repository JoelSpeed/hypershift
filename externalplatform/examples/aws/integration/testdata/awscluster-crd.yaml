# A stand-in for Cluster API Provider AWS's own AWSCluster.
#
# Only the fields this example's provisioner writes, and the status a fake provider controller
# reports back. Installing CAPA's real CRD here would mean vendoring or downloading CAPA to
# run a test about HyperShift's contract, which is the dependency the example is written to
# avoid in the first place.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: awsclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  scope: Namespaced
  names:
    kind: AWSCluster
    listKind: AWSClusterList
    singular: awscluster
    plural: awsclusters
  versions:
    - name: v1beta2
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                controlPlaneEndpoint:
                  type: object
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
                controlPlaneLoadBalancer:
                  type: object
                  properties:
                    loadBalancerType:
                      type: string
                network:
                  type: object
                  properties:
                    vpc:
                      type: object
                      properties:
                        id:
                          type: string
                    subnets:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                    securityGroupOverrides:
                      type: object
                      additionalProperties:
                        type: string
                additionalTags:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                initialization:
                  type: object
                  properties:
                    provisioned:
                      type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
