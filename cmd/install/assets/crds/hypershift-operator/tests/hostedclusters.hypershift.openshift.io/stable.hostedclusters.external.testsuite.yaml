apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster External platform is gated"
crdName: hostedclusters.hypershift.openshift.io
featureGates:
  - -ExternalPlatform
version: v1beta1
tests:
  onCreate:
  - name: When the ExternalPlatform feature gate is disabled the External platform type should be rejected
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: External
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    expectedError: 'spec.platform.type: Unsupported value: "External"'
