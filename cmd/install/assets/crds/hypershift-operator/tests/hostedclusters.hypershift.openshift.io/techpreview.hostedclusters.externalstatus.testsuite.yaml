apiVersion: apiextensions.k8s.io/v1
name: "HostedCluster External platform status validation"
crdName: hostedclusters.hypershift.openshift.io
featureGates:
  - ExternalPlatform
version: v1beta1
tests:
  onUpdate:
  - name: When the integrator declares an external cloud controller manager it should pass
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: External
          external:
            hostedClusterTemplate:
              apiGroup: example.io
              resource: foohostedclustertemplates
              name: my-infra
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: External
          external:
            hostedClusterTemplate:
              apiGroup: example.io
              resource: foohostedclustertemplates
              name: my-infra
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
      status:
        platform:
          external:
            name: ExampleCloud
            cloudControllerManager:
              state: External
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      status:
        platform:
          external:
            name: ExampleCloud
            cloudControllerManager:
              state: External

  - name: When the integrator declares no cloud controller manager it should pass
