        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
    updated: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: External
          external:
            hostedClusterTemplate:
              apiGroup: example.io
              resource: foohostedclustertemplates
              name: my-infra
        pullSecret:
          name: secret
        release:
          image: quay.io/openshift-release-dev/ocp-release:4.15.11-x86_64
        services:
        - service: APIServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
      status:
        platform:
          external:
            name: ExampleCloud
            cloudControllerManager:
              state: None
    expected: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      status:
        platform:
          external:
            name: ExampleCloud
            cloudControllerManager:
              state: None

  - name: When the cloud controller manager state is not External or None it should fail
    initial: |
      apiVersion: hypershift.openshift.io/v1beta1
      kind: HostedCluster
      spec:
        dns:
          baseDomain: example.com
        platform:
          type: External
          external:
            hostedClusterTemplate:
              apiGroup: example.io
