        - service: OAuthServer
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Konnectivity
          servicePublishingStrategy:
            type: Route
            route: {}
        - service: Ignition
          servicePublishingStrategy:
            type: Route
            route: {}
      status:
        platform:
          external:
            name: ""
            cloudControllerManager:
              state: External
    expectedStatusError: "name in body should be at least 1 chars long"

